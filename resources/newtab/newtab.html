<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeon Browser — Windows 11 Sovereign Workstation</title>
  <style>
    /* =========================================================
       WINDOWS 11 FLUENT DESIGN SYSTEM & DARK TOKENS
    ========================================================= */
    :root {
      --win11-bg: #090a10;
      --win11-sidebar: #0f111a;
      --win11-card: #161826;
      --win11-card-hover: #1e2133;
      --win11-accent: #6c63ff;
      --win11-accent-hover: #7c75ff;
      --win11-text: #f3f4f6;
      --win11-muted: #9ca3af;
      --win11-border: rgba(255, 255, 255, 0.08);
      --win11-border-active: rgba(108, 99, 255, 0.4);
      --font-segoe: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--win11-bg);
      color: var(--win11-text);
      font-family: var(--font-segoe);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Windows 11 Glow */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(108, 99, 255, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ── Windows 11 Modern Vertical Sidebar (240px) ── */
    .win-sidebar {
      width: 240px;
      height: 100vh;
      background: var(--win11-sidebar);
      border-right: 1px solid var(--win11-border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .win-sidebar.collapsed {
      width: 56px;
      padding: 16px 8px;
      align-items: center;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .brand-logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    .win11-logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6c63ff 0%, #a78bfa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #ffffff;
      font-size: 14px;
    }
    .toggle-sidebar-btn {
      background: transparent;
      border: none;
      color: var(--win11-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .toggle-sidebar-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

    /* Action Tiles */
    .action-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }
    .action-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      background: var(--win11-card);
      border: 1px solid var(--win11-border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .action-tile:hover {
      background: var(--win11-card-hover);
      border-color: var(--win11-accent);
      transform: translateY(-1px);
    }

    .section-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--win11-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin: 12px 4px 8px;
    }

    /* Tabs List */
    .tabs-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tab-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: transparent;
      border-radius: 8px;
      color: var(--win11-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }
    .tab-item.active {
      background: var(--win11-card-hover);
      color: #ffffff;
      font-weight: 600;
      border-left: 3px solid var(--win11-accent);
    }
    .tab-close-btn { opacity: 0.4; font-size: 13px; }
    .tab-close-btn:hover { opacity: 1; color: #ef4444; }

    .new-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      background: var(--win11-card);
      border: 1px dashed var(--win11-border);
      border-radius: 8px;
      color: var(--win11-accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.15s;
    }
    .new-tab-btn:hover { background: rgba(108, 99, 255, 0.12); border-color: var(--win11-accent); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--win11-border);
      font-size: 12px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Main Viewport Content Area ── */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--win11-bg);
      padding: 8px 12px 12px;
    }

    /* Windows 11 Top Bar */
    .top-address-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--win11-sidebar);
      border: 1px solid var(--win11-border);
      border-radius: 10px;
      padding: 6px 14px;
      margin-bottom: 8px;
    }
    .nav-arrow {
      background: transparent;
      border: none;
      color: var(--win11-muted);
      font-size: 15px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.08); color: #ffffff; }

    .url-input-field {
      flex: 1;
      background: var(--win11-card);
      border: 1px solid var(--win11-border);
      border-radius: 8px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }
    .url-input-field:focus { border-color: var(--win11-accent); }

    /* Windows 11 Caption Controls */
    .win11-caption-controls {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .caption-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--win11-muted);
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
    }
    .caption-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .caption-btn.close:hover { background: #dc2626; color: #ffffff; }

    /* Main Dashboard View */
    .dashboard-canvas {
      flex: 1;
      background: var(--win11-sidebar);
      border: 1px solid var(--win11-border);
      border-radius: 12px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .dashboard-title {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .dashboard-sub {
      font-size: 14px;
      color: var(--win11-muted);
      margin-bottom: 32px;
    }

    .search-box-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
    }
    .big-search-input {
      flex: 1;
      background: var(--win11-card);
      border: 1px solid var(--win11-border-active);
      border-radius: 12px;
      padding: 16px 20px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .big-search-btn {
      background: var(--win11-accent);
      color: #ffffff;
      border: none;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .big-search-btn:hover { background: var(--win11-accent-hover); }

    /* Quick Links Grid */
    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }
    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 16px;
      background: var(--win11-card);
      border: 1px solid var(--win11-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .link-card:hover {
      background: var(--win11-card-hover);
      border-color: var(--win11-accent);
      transform: translateY(-2px);
    }
    .link-icon { font-size: 24px; }
    .link-name { font-size: 13px; font-weight: 600; color: var(--win11-text); }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Windows 11 Modern Sidebar -->
    <div class="win-sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo-group">
          <div class="win11-logo-icon">A</div>
          <span>Aeon Browser</span>
        </div>
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">◀</button>
      </div>

      <div class="action-row">
        <div class="action-tile" title="Search">🔍</div>
        <div class="action-tile" title="Bookmarks">⭐</div>
        <div class="action-tile" title="History">🕒</div>
        <div class="action-tile" title="Settings">⚙️</div>
      </div>

      <div class="section-header">OPEN TABS</div>
      <div class="tabs-container">
        <div class="tab-item active" onclick="navUrl('aeon://newtab')">
          <span>🌐 New Tab</span>
          <span class="tab-close-btn">×</span>
        </div>
        <div class="tab-item" onclick="navUrl('https://www.google.com')">
          <span>🔍 Google</span>
          <span class="tab-close-btn">×</span>
        </div>
        <div class="tab-item" onclick="navUrl('https://github.com')">
          <span>🐙 GitHub</span>
          <span class="tab-close-btn">×</span>
        </div>
      </div>

      <button class="new-tab-btn" onclick="navUrl('aeon://newtab')">+ New Tab</button>

      <div class="sidebar-footer">
        <span>🟢 Secure Clearnet Connection</span>
      </div>
    </div>

    <!-- Main Viewport -->
    <div class="main-viewport">
      <div class="top-address-bar">
        <button class="nav-arrow">←</button>
        <button class="nav-arrow">→</button>
        <button class="nav-arrow">↻</button>
        <input type="text" class="url-input-field" id="urlBar" value="aeon://newtab" onkeydown="handleUrlKey(event)" />

        <!-- Windows 11 Caption Controls (Native Style) -->
        <div class="win11-caption-controls">
          <button class="caption-btn" title="Minimize">—</button>
          <button class="caption-btn" title="Maximize">☐</button>
          <button class="caption-btn close" title="Close">✕</button>
        </div>
      </div>

      <div class="dashboard-canvas">
        <h1 class="dashboard-title">Aeon Sovereign Workstation</h1>
        <p class="dashboard-sub">Fast, Private, Sovereign Web Browsing for Windows 11</p>

        <div class="search-box-container">
          <input type="text" class="big-search-input" id="searchInput" placeholder="Search Google or type a web address..." onkeydown="handleSearchKey(event)" />
          <button class="big-search-btn" onclick="executeSearch()">Search</button>
        </div>

        <div class="quick-links-grid">
          <div class="link-card" onclick="navUrl('https://www.google.com')">
            <span class="link-icon">🔍</span>
            <span class="link-name">Google</span>
          </div>
          <div class="link-card" onclick="navUrl('https://github.com')">
            <span class="link-icon">🐙</span>
            <span class="link-name">GitHub</span>
          </div>
          <div class="link-card" onclick="navUrl('https://www.youtube.com')">
            <span class="link-icon">▶️</span>
            <span class="link-name">YouTube</span>
          </div>
          <div class="link-card" onclick="navUrl('https://news.ycombinator.com')">
            <span class="link-icon">🟧</span>
            <span class="link-name">Hacker News</span>
          </div>
          <div class="link-card" onclick="navUrl('https://www.wikipedia.org')">
            <span class="link-icon">📚</span>
            <span class="link-name">Wikipedia</span>
          </div>
          <div class="link-card" onclick="navUrl('https://x.com')">
            <span class="link-icon">𝕏</span>
            <span class="link-name">X / Twitter</span>
          </div>
          <div class="link-card" onclick="navUrl('https://www.amazon.com')">
            <span class="link-icon">🛒</span>
            <span class="link-name">Amazon</span>
          </div>
          <div class="link-card" onclick="navUrl('https://chatgpt.com')">
            <span class="link-icon">🤖</span>
            <span class="link-name">ChatGPT</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
    function navUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('aeon://')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
      }
      document.getElementById('urlBar').value = url;
      if (url.startsWith('http')) {
        window.location.href = url;
      }
    }
    function handleUrlKey(e) {
      if (e.key === 'Enter') {
        navUrl(document.getElementById('urlBar').value);
      }
    }
    function handleSearchKey(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    }
    function executeSearch() {
      const q = document.getElementById('searchInput').value;
      if (q) navUrl(q);
    }
  </script>
</body>
</html>
