<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeon Browser — Zen Workstation UI</title>
  <style>
    /* =========================================================
       ZEN BROWSER × WINDOWS 11 ULTRA-PREMIUM DESIGN SYSTEM
    ========================================================= */
    :root {
      --zen-bg: #07080d;
      --zen-sidebar: #0d0f18;
      --zen-card: #141724;
      --zen-card-hover: #1c2032;
      --zen-accent: #6c63ff;
      --zen-accent-glow: rgba(108, 99, 255, 0.35);
      --zen-accent-hover: #7d76ff;
      --zen-text: #f3f4f8;
      --zen-muted: #8e95a5;
      --zen-border: rgba(255, 255, 255, 0.08);
      --zen-border-active: rgba(108, 99, 255, 0.5);
      --font-segoe: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--zen-bg);
      color: var(--zen-text);
      font-family: var(--font-segoe);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Windows 11 Fluent Glow */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 75% 55% at 50% -15%, rgba(108, 99, 255, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 55% 65% at 90% 90%, rgba(59, 130, 246, 0.12) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .zen-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ── Zen Browser Vertical Sidebar (240px) ── */
    .zen-sidebar {
      width: 240px;
      height: 100vh;
      background: var(--zen-sidebar);
      border-right: 1px solid var(--zen-border);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .zen-sidebar.collapsed {
      width: 56px;
      padding: 14px 8px;
      align-items: center;
    }

    .zen-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 2px 4px;
    }
    .zen-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .zen-app-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6c63ff 0%, #a78bfa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #ffffff;
      font-size: 14px;
      box-shadow: 0 0 14px var(--zen-accent-glow);
    }
    .toggle-sidebar-btn {
      background: transparent;
      border: none;
      color: var(--zen-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .toggle-sidebar-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

    /* Zen Workspaces Bar */
    .zen-workspaces-bar {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: var(--zen-card);
      border: 1px solid var(--zen-border);
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .zen-workspace-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      filter: grayscale(1);
      opacity: 0.55;
      transition: all 0.2s ease;
    }
    .zen-workspace-item:hover, .zen-workspace-item.active {
      filter: grayscale(0);
      opacity: 1;
      background: var(--zen-card-hover);
    }
    .zen-workspace-item.active {
      border-bottom: 2px solid var(--zen-accent);
      box-shadow: 0 4px 12px var(--zen-accent-glow);
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--zen-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 12px 6px 8px;
    }

    /* Vertical Tabs List */
    .zen-tabs-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zen-tab-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: transparent;
      border-radius: 8px;
      color: var(--zen-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .zen-tab-card:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }
    .zen-tab-card.active {
      background: var(--zen-card-hover);
      color: #ffffff;
      font-weight: 600;
      border-left: 3px solid var(--zen-accent);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .tab-close { opacity: 0.35; font-size: 13px; }
    .tab-close:hover { opacity: 1; color: #ef4444; }

    .new-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      background: var(--zen-card);
      border: 1px dashed var(--zen-border-active);
      border-radius: 8px;
      color: var(--zen-accent);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.15s;
    }
    .new-tab-btn:hover { background: rgba(108, 99, 255, 0.16); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--zen-border);
      font-size: 11.5px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    /* ── Main Canvas Viewport ── */
    .zen-main-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px 12px 12px;
    }

    /* Windows 11 Address Bar */
    .win11-address-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--zen-sidebar);
      border: 1px solid var(--zen-border);
      border-radius: 10px;
      padding: 6px 14px;
      margin-bottom: 8px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--zen-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

    .url-input {
      flex: 1;
      background: var(--zen-card);
      border: 1px solid var(--zen-border);
      border-radius: 8px;
      padding: 7.5px 16px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }
    .url-input:focus { border-color: var(--zen-accent); box-shadow: 0 0 10px var(--zen-accent-glow); }

    /* Windows 11 Native Caption Controls */
    .win11-caption-box {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .win11-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--zen-muted);
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
    }
    .win11-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .win11-btn.close:hover { background: #dc2626; color: #ffffff; }

    /* Dashboard View */
    .dashboard-body {
      flex: 1;
      background: var(--zen-sidebar);
      border: 1px solid var(--zen-border);
      border-radius: 12px;
      padding: 56px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .greeting-pill {
      background: rgba(108, 99, 255, 0.12);
      border: 1px solid var(--zen-border-active);
      color: var(--zen-accent);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 60%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.8px;
      text-align: center;
    }
    .hero-sub {
      font-size: 14.5px;
      color: var(--zen-muted);
      margin-bottom: 40px;
      text-align: center;
    }

    .search-wrapper {
      width: 100%;
      max-width: 640px;
      display: flex;
      gap: 12px;
      margin-bottom: 48px;
    }
    .search-input {
      flex: 1;
      background: var(--zen-card);
      border: 1px solid var(--zen-border-active);
      border-radius: 16px;
      padding: 18px 24px;
      color: #ffffff;
      font-size: 15.5px;
      outline: none;
      font-family: inherit;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--zen-accent-glow);
    }
    .search-btn {
      background: linear-gradient(135deg, #6c63ff 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      padding: 0 32px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--zen-accent-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--zen-accent-glow); }

    /* High-DPI Quick Access Grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 640px;
    }
    .quick-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 16px;
      background: var(--zen-card);
      border: 1px solid var(--zen-border);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .quick-card:hover {
      background: var(--zen-card-hover);
      border-color: var(--zen-accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(108, 99, 255, 0.22);
    }
    .quick-icon-svg {
      width: 32px;
      height: 32px;
    }
    .quick-label { font-size: 13.5px; font-weight: 700; color: var(--zen-text); }
  </style>
</head>
<body>
  <div class="zen-shell">
    <!-- Zen Browser Vertical Sidebar -->
    <div class="zen-sidebar" id="sidebar">
      <div class="zen-sidebar-header">
        <div class="zen-brand-group">
          <div class="zen-app-logo">A</div>
          <span>Aeon Browser</span>
        </div>
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">◀</button>
      </div>

      <!-- Zen Workspaces Selector Bar -->
      <div class="zen-workspaces-bar">
        <div class="zen-workspace-item active" title="General Sovereign Space" onclick="switchSpace(this)">⚡</div>
        <div class="zen-workspace-item" title="Privacy Shield Matrix" onclick="switchSpace(this)">🛡️</div>
        <div class="zen-workspace-item" title="DelgadoLogic Workspace" onclick="switchSpace(this)">💼</div>
        <div class="zen-workspace-item" title="System Settings" onclick="switchSpace(this)">⚙️</div>
      </div>

      <div class="section-label">OPEN TABS</div>
      <div class="zen-tabs-list">
        <div class="zen-tab-card active" onclick="navUrl('aeon://newtab')">
          <span>🌐 New Tab</span>
          <span class="tab-close">×</span>
        </div>
        <div class="zen-tab-card" onclick="navUrl('https://www.google.com')">
          <span>🔍 Google</span>
          <span class="tab-close">×</span>
        </div>
        <div class="zen-tab-card" onclick="navUrl('https://github.com')">
          <span>🐙 GitHub</span>
          <span class="tab-close">×</span>
        </div>
      </div>

      <button class="new-tab-btn" onclick="navUrl('aeon://newtab')">+ New Tab</button>

      <div class="sidebar-footer">
        <span>🟢 Secure Clearnet Connection</span>
      </div>
    </div>

    <!-- Main Canvas Viewport -->
    <div class="zen-main-canvas">
      <div class="win11-address-bar">
        <button class="nav-btn">←</button>
        <button class="nav-btn">→</button>
        <button class="nav-btn">↻</button>
        <input type="text" class="url-input" id="urlBar" value="aeon://newtab" onkeydown="handleUrlKey(event)" />

        <!-- Windows 11 Native Caption Controls -->
        <div class="win11-caption-box">
          <button class="win11-btn" title="Minimize">—</button>
          <button class="win11-btn" title="Maximize">☐</button>
          <button class="win11-btn close" title="Close">✕</button>
        </div>
      </div>

      <div class="dashboard-body">
        <div class="greeting-pill">✦ DELGADOLOGIC WORKSTATION ✦</div>
        <h1 class="hero-title">Aeon Sovereign Workstation</h1>
        <p class="hero-sub">Fast, Sovereign, High-Performance Web Browsing for Windows 11</p>

        <div class="search-wrapper">
          <input type="text" class="search-input" id="searchInput" placeholder="Search Google or enter a web address..." onkeydown="handleSearchKey(event)" />
          <button class="search-btn" onclick="executeSearch()">Search</button>
        </div>

        <div class="quick-grid">
          <div class="quick-card" onclick="navUrl('https://www.google.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <span class="quick-label">Google</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://github.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            <span class="quick-label">GitHub</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://www.youtube.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            <span class="quick-label">YouTube</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://news.ycombinator.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#FF6600"><rect width="24" height="24" rx="4"/><path fill="#ffffff" d="M11 15v4h2v-4l4-8h-2.3l-2.7 5.5L9.3 7H7l4 8z"/></svg>
            <span class="quick-label">Hacker News</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://www.wikipedia.org')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#ffffff"><path d="M12.09 13.118l3.629-8.412h2.527l-5.717 12.871-2.909-6.319-2.936 6.319L1.042 4.706h2.502l3.655 8.412 2.378-5.185-1.464-3.227h2.451l1.526 3.412z"/></svg>
            <span class="quick-label">Wikipedia</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://x.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#ffffff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span class="quick-label">X / Twitter</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://www.amazon.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#FF9900"><path d="M13.435 15.688c-2.408 1.774-5.91 2.37-8.91 1.488-.567-.166-1.127-.406-1.636-.719-.24-.148-.309-.452-.083-.68.225-.229.567-.183.823.01.554.417 1.206.729 1.895.917 2.507.68 5.438.166 7.426-1.25.183-.13.438-.073.57.1.13.173.085.438-.085.584z"/><path fill="#ffffff" d="M14.52 13.917c-.31.066-.63.098-.95.098-1.58 0-2.8-1.07-2.8-2.61 0-1.78 1.46-2.73 3.6-2.73h.15v-.31c0-.79-.53-1.27-1.46-1.27-.77 0-1.56.24-2.12.59-.14.09-.32.06-.42-.07l-.36-.48c-.1-.13-.07-.32.06-.41.77-.52 1.83-.85 2.97-.85 1.76 0 2.87.97 2.87 2.58v4.22c0 .76.15 1.13.41 1.49.09.13.06.31-.07.4l-.49.36c-.13.09-.31.06-.4-.07-.26-.35-.42-.81-.42-1.42z"/></svg>
            <span class="quick-label">Amazon</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://chatgpt.com')">
            <svg class="quick-icon-svg" viewBox="0 0 24 24" fill="#10a37f"><path d="M22.28 9.87a5.985 5.985 0 0 0-.52-4.85 6.07 6.07 0 0 0-6.55-2.88 6.002 6.002 0 0 0-4.63-2.07 5.985 5.985 0 0 0-5.69 4.14 6.01 6.01 0 0 0-4.04 2.92 6.02 6.02 0 0 0 .73 7.07 5.985 5.985 0 0 0 .52 4.85 6.07 6.07 0 0 0 6.55 2.88 6.002 6.002 0 0 0 4.63 2.07 5.985 5.985 0 0 0 5.69-4.14 6.01 6.01 0 0 0 4.04-2.92 6.008 6.008 0 0 0-.73-7.07zm-9.78 12.3c-1.34 0-2.61-.43-3.66-1.22l.19-.11 4.35-2.51a.88.88 0 0 0 .44-.76v-5.26l1.58.91v4.86a4.19 4.19 0 0 1-2.9 3.09z"/></svg>
            <span class="quick-label">ChatGPT</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
    function switchSpace(el) {
      document.querySelectorAll('.zen-workspace-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }
    function navUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('aeon://')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
      }
      document.getElementById('urlBar').value = url;
      if (url.startsWith('http')) {
        window.location.href = url;
      }
    }
    function handleUrlKey(e) {
      if (e.key === 'Enter') {
        navUrl(document.getElementById('urlBar').value);
      }
    }
    function handleSearchKey(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    }
    function executeSearch() {
      const q = document.getElementById('searchInput').value;
      if (q) navUrl(q);
    }
  </script>
</body>
</html>
