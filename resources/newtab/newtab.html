<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeon Browser — Zen Workstation UI</title>
  <style>
    /* =========================================================
       ZEN BROWSER × WINDOWS 11 FLUENT DESIGN TOKENS
    ========================================================= */
    :root {
      --zen-bg: #090a0f;
      --zen-sidebar: #0e1018;
      --zen-card: #151824;
      --zen-card-hover: #1d2133;
      --zen-accent: #6c63ff;
      --zen-accent-hover: #7d76ff;
      --zen-text: #f1f3f9;
      --zen-muted: #8c93a6;
      --zen-border: rgba(255, 255, 255, 0.07);
      --zen-border-active: rgba(108, 99, 255, 0.45);
      --font-segoe: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--zen-bg);
      color: var(--zen-text);
      font-family: var(--font-segoe);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Windows 11 Fluent Glow */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(108, 99, 255, 0.16) 0%, transparent 65%),
        radial-gradient(ellipse 50% 60% at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .zen-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ── Zen Browser Vertical Sidebar (240px) ── */
    .zen-sidebar {
      width: 240px;
      height: 100vh;
      background: var(--zen-sidebar);
      border-right: 1px solid var(--zen-border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .zen-sidebar.collapsed {
      width: 56px;
      padding: 12px 8px;
      align-items: center;
    }

    /* Sidebar Window Drag Region & Brand */
    .zen-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 4px 6px;
    }
    .zen-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    .zen-app-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6c63ff 0%, #a78bfa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #ffffff;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.35);
    }
    .toggle-sidebar-btn {
      background: transparent;
      border: none;
      color: var(--zen-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .toggle-sidebar-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

    /* Zen Workspaces Icon Bar */
    .zen-workspaces-bar {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: var(--zen-card);
      border: 1px solid var(--zen-border);
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .zen-workspace-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      filter: grayscale(1);
      opacity: 0.6;
      transition: all 0.2s ease;
    }
    .zen-workspace-item:hover, .zen-workspace-item.active {
      filter: grayscale(0);
      opacity: 1;
      background: var(--zen-card-hover);
    }
    .zen-workspace-item.active {
      border-bottom: 2px solid var(--zen-accent);
    }

    .section-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--zen-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 12px 6px 8px;
    }

    /* Vertical Tabs List */
    .zen-tabs-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zen-tab-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: transparent;
      border-radius: 8px;
      color: var(--zen-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .zen-tab-card:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }
    .zen-tab-card.active {
      background: var(--zen-card-hover);
      color: #ffffff;
      font-weight: 600;
      border-left: 3px solid var(--zen-accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .tab-close { opacity: 0.4; font-size: 13px; }
    .tab-close:hover { opacity: 1; color: #ef4444; }

    .new-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      background: var(--zen-card);
      border: 1px dashed var(--zen-border-active);
      border-radius: 8px;
      color: var(--zen-accent);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.15s;
    }
    .new-tab-btn:hover { background: rgba(108, 99, 255, 0.14); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--zen-border);
      font-size: 11.5px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Main Canvas Viewport ── */
    .zen-main-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px 12px 12px;
    }

    /* Windows 11 Address Bar */
    .win11-address-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--zen-sidebar);
      border: 1px solid var(--zen-border);
      border-radius: 10px;
      padding: 6px 14px;
      margin-bottom: 8px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--zen-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

    .url-input {
      flex: 1;
      background: var(--zen-card);
      border: 1px solid var(--zen-border);
      border-radius: 8px;
      padding: 7px 14px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }
    .url-input:focus { border-color: var(--zen-accent); }

    /* Windows 11 Native Caption Controls */
    .win11-caption-box {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .win11-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--zen-muted);
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
    }
    .win11-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .win11-btn.close:hover { background: #dc2626; color: #ffffff; }

    /* Dashboard View */
    .dashboard-body {
      flex: 1;
      background: var(--zen-sidebar);
      border: 1px solid var(--zen-border);
      border-radius: 12px;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .hero-title {
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .hero-sub {
      font-size: 14px;
      color: var(--zen-muted);
      margin-bottom: 36px;
    }

    .search-wrapper {
      width: 100%;
      max-width: 620px;
      display: flex;
      gap: 10px;
      margin-bottom: 44px;
    }
    .search-input {
      flex: 1;
      background: var(--zen-card);
      border: 1px solid var(--zen-border-active);
      border-radius: 14px;
      padding: 18px 24px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .search-btn {
      background: var(--zen-accent);
      color: #ffffff;
      border: none;
      padding: 0 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-btn:hover { background: var(--zen-accent-hover); }

    /* Quick Access Grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 620px;
    }
    .quick-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 16px;
      background: var(--zen-card);
      border: 1px solid var(--zen-border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quick-card:hover {
      background: var(--zen-card-hover);
      border-color: var(--zen-accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(108, 99, 255, 0.2);
    }
    .quick-icon { font-size: 26px; }
    .quick-label { font-size: 13px; font-weight: 600; color: var(--zen-text); }
  </style>
</head>
<body>
  <div class="zen-shell">
    <!-- Zen Browser Vertical Sidebar -->
    <div class="zen-sidebar" id="sidebar">
      <div class="zen-sidebar-header">
        <div class="zen-brand-group">
          <div class="zen-app-logo">A</div>
          <span>Aeon Browser</span>
        </div>
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">◀</button>
      </div>

      <!-- Zen Workspaces Selector Bar -->
      <div class="zen-workspaces-bar">
        <div class="zen-workspace-item active" title="General Space" onclick="switchSpace(this)">⚡</div>
        <div class="zen-workspace-item" title="Privacy Shield Space" onclick="switchSpace(this)">🛡️</div>
        <div class="zen-workspace-item" title="DelgadoLogic Work" onclick="switchSpace(this)">💼</div>
        <div class="zen-workspace-item" title="Settings" onclick="switchSpace(this)">⚙️</div>
      </div>

      <div class="section-label">OPEN TABS</div>
      <div class="zen-tabs-list">
        <div class="zen-tab-card active" onclick="navUrl('aeon://newtab')">
          <span>🌐 New Tab</span>
          <span class="tab-close">×</span>
        </div>
        <div class="zen-tab-card" onclick="navUrl('https://www.google.com')">
          <span>🔍 Google</span>
          <span class="tab-close">×</span>
        </div>
        <div class="zen-tab-card" onclick="navUrl('https://github.com')">
          <span>🐙 GitHub</span>
          <span class="tab-close">×</span>
        </div>
      </div>

      <button class="new-tab-btn" onclick="navUrl('aeon://newtab')">+ New Tab</button>

      <div class="sidebar-footer">
        <span>🟢 Secure Clearnet Connection</span>
      </div>
    </div>

    <!-- Main Canvas Viewport -->
    <div class="zen-main-canvas">
      <div class="win11-address-bar">
        <button class="nav-btn">←</button>
        <button class="nav-btn">→</button>
        <button class="nav-btn">↻</button>
        <input type="text" class="url-input" id="urlBar" value="aeon://newtab" onkeydown="handleUrlKey(event)" />

        <!-- Windows 11 Native Caption Controls -->
        <div class="win11-caption-box">
          <button class="win11-btn" title="Minimize">—</button>
          <button class="win11-btn" title="Maximize">☐</button>
          <button class="win11-btn close" title="Close">✕</button>
        </div>
      </div>

      <div class="dashboard-body">
        <h1 class="hero-title">Aeon Sovereign Workstation</h1>
        <p class="hero-sub">Fast, Private, Sovereign Web Browsing for Windows 11</p>

        <div class="search-wrapper">
          <input type="text" class="search-input" id="searchInput" placeholder="Search Google or enter a web address..." onkeydown="handleSearchKey(event)" />
          <button class="search-btn" onclick="executeSearch()">Search</button>
        </div>

        <div class="quick-grid">
          <div class="quick-card" onclick="navUrl('https://www.google.com')">
            <span class="quick-icon">🔍</span>
            <span class="quick-label">Google</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://github.com')">
            <span class="quick-icon">🐙</span>
            <span class="quick-label">GitHub</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://www.youtube.com')">
            <span class="quick-icon">▶️</span>
            <span class="quick-label">YouTube</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://news.ycombinator.com')">
            <span class="quick-icon">🟧</span>
            <span class="quick-label">Hacker News</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://www.wikipedia.org')">
            <span class="quick-icon">📚</span>
            <span class="quick-label">Wikipedia</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://x.com')">
            <span class="quick-icon">𝕏</span>
            <span class="quick-label">X / Twitter</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://www.amazon.com')">
            <span class="quick-icon">🛒</span>
            <span class="quick-label">Amazon</span>
          </div>
          <div class="quick-card" onclick="navUrl('https://chatgpt.com')">
            <span class="quick-icon">🤖</span>
            <span class="quick-label">ChatGPT</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
    function switchSpace(el) {
      document.querySelectorAll('.zen-workspace-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }
    function navUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('aeon://')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
      }
      document.getElementById('urlBar').value = url;
      if (url.startsWith('http')) {
        window.location.href = url;
      }
    }
    function handleUrlKey(e) {
      if (e.key === 'Enter') {
        navUrl(document.getElementById('urlBar').value);
      }
    }
    function handleSearchKey(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    }
    function executeSearch() {
      const q = document.getElementById('searchInput').value;
      if (q) navUrl(q);
    }
  </script>
</body>
</html>
